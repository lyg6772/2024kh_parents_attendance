[tool.poetry]
name = "2024kh-parents-attendance"
version = "1.0.5"
description = ""
authors = ["lyg6772 <lyg6772@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
jinja2 = "^3.1.3"
aiomysql = "^0.2.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
pymysql = "^1.1.0"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dateutil = "^2.9.0.post0"
python-multipart = "^0.0.9"
cryptography = "^44.0.3"
oracledb = "^3.4.2"
bcrypt = "4.0.1"
openpyxl = "^3.1.5"
groq = "^0.25"
google-genai = "^1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"
aiosqlite = "^0.20"
ruff = "^0.16.1"
pyright = "^1.1.411"
pre-commit = "^4.6.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/harness 는 하네스 커널의 골든 테스트다. 설치 시점(2026-07-31)에는 이 레포
# 프로필에서 12건이 빨개서 기본 수집에서 뺐었다 — 그 red 는 결함이 아니라 커널
# 픽스처가 자기 프로필 대신 **이 레포의** 프로필을 읽었기 때문이었다. moru 쪽에서
# 결합을 끊었고(커널 0.24.1), 지금은 127건 전부 green 이라 제외할 이유가 없다.
# 상시 빨간 스위트만큼이나 안 도는 스위트도 안 읽히므로, 예외를 두지 않는다.
# 매 실행이 2~3분이지만 기본 수집에 있어도 pre-push 는 영향 테스트만 고른다
# (scripts/ 나 tests/harness/ 를 건드릴 때만 실제로 돈다).

[tool.ruff]
# 기존 코드에 부채가 있는 상태로 도입했다. 훅은 비차단이고, 게이트는 stage-6
# 검증이 잡는다 — 자세한 건수는 .agents/context/codebase-conventions.md.
target-version = "py312"
line-length = 100
exclude = ["app/template", ".venv", "tests/harness"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "DTZ", "S", "BLE", "PL", "RUF"]
ignore = [
  "E501",     # line-length 는 formatter 가 소유한다
  "S101",     # assert - 테스트가 쓴다
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입 관용구. 이게 없으면 B008 이 19건 뜨는데 전부 오탐이다
# (실측 2026-07-31) — 규칙을 끄지 않고 호출만 면제해 진짜 B008 은 계속 잡는다.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
  "fastapi.Security",
]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "app/template"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
