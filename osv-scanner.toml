# osv-scanner 기준선 — moru 하네스 설치 시점(2026-07-31)의 기존 의존성 부채.
#
# 이 파일은 우회가 아니라 기록이다. 아래 등재된 건만 조용해지고, 새로 들어오는
# 취약 의존성은 pre-push 에서 그대로 막힌다. 기존 린트 부채를 비차단으로 내리고
# 그 결정을 .agents/context/codebase-conventions.md 에 남긴 것과 같은 모양이다 —
# 부채를 측정해 고정하고, 새 부채는 계속 막는다.
#
# **건수를 이 머리말에 적지 않는다.** 아래 등재 목록이 곧 건수이고, 해소할 때마다
# 항목을 지우는 것이 이 파일의 사용법이라(3번 참조) 머리말 숫자는 설계상 어긋난다.
# 현재 값은 `osv-scanner --recursive .`. 움직이는 값은 문서가 아니라 명령이
# 소유한다는 이 레포 규칙 그대로다 (codebase-conventions.md § 린트 부채).
#
# **어느 패키지가 실사용 경로 위인가는 추측하지 않는다 — 실행 프레임으로 잰다.**
# 2026-08-02 실측(`sys.setprofile` 로 요청 중 프레임 계수, `tests/test_http_env.py` 가
# 그 계측을 회귀 자산으로 들고 있다):
#
#   덮인다   jinja2(SSR) · starlette(ASGI) · pyjwt(인증) · python-multipart(폼)
#   미검증   h11(HTTP 파서) — **덮인다고 주장할 근거가 아직 없다.** ASGITransport 는
#            HTTP 바이트를 파싱하지 않아 0 프레임이고, 실소켓 테스트
#            (`tests/test_http_socket.py`)가 있지만 그 프레임 계측이 **서버가 아니라
#            요청을 보내는 httpx 쪽 h11** 을 센다. h11 을 전혀 쓰지 않는 서버로
#            요청해도 프레임이 잡히는 것을 확인했다(2026-08-02, 7단계 리뷰).
#            실제로는 uvicorn 이 h11 을 쓰므로 덮이고 있을 가능성이 높지만, 그것을
#            **증명하는 것이 저 테스트가 아니다.** 계측 재구성은 후속 과제 —
#            그때까지 h11 업그레이드는 이 오라클로 검증되지 않는다.
#   안 덮인다 pymysql · aiomysql — 테스트는 SQLite 를 쓴다 (구조적)
#   안 덮인다 cryptography — **이 앱에 실행 경로가 없다.** PyJWT 는 HS256 이라 stdlib
#            `hmac` 을 쓰고, 비밀번호는 `bcrypt` 패키지가 처리한다. cryptography 는
#            RS256/EC 용이다. (이 줄은 원래 "JWT/bcrypt 하부"라고 적혀 있었다 —
#            틀린 서술이었고 실측으로 정정했다.)
#
# 그 값을 이 파일에 숫자로 박지 않는 이유는 위 § 건수 원칙과 같다. 지금 무엇이
# 덮이는지는 `poetry run pytest tests/test_http_env.py -q` 가 소유하고, 커버리지가
# 늘면 그 테스트가 red 로 알려준다 (못 덮는 것을 0 으로 고정해 두었기 때문이다).
# `tests/test_http_socket.py` 는 **이 목록의 근거가 아니다** — 위 h11 줄 참조.
#
# 해소 순서:
#   1) HTTP·인증 통합 테스트를 추가해 오라클을 만든다  ← **완료 (2026-08-02)**
#      `tests/test_http_*.py` 40개. 이전에는 앱 테스트가 전부 순수 유닛이라 위
#      패키지 중 실행하는 것이 하나도 없었고, 그 상태에서 버전을 올리고 보는 초록은
#      아무것도 증명하지 않았다. (`tests/harness/` 골든 테스트는 여기서 도움이 안
#      된다 — 그건 강제 스크립트를 심판하지 앱 의존성을 타지 않는다.)
#   2) 의존성을 올린다 (등재된 것 대부분은 상류 수정본이 있다)
#      **오라클이 덮는 것부터 올린다.** 안 덮이는 것(pymysql·aiomysql·cryptography)은
#      올려도 이 테스트들이 아무 말을 안 하므로, 그 사실을 알고 올리거나 먼저
#      커버리지를 넓힌다.
#   3) 해소된 항목을 이 파일에서 지운다 — 목록이 비면 파일을 지운다
#
# 이 파일이 오래 살아 있으면 그 자체가 부채 신호다. 늘어나면 더 그렇다.

