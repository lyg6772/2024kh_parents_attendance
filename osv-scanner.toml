# osv-scanner 기준선 — moru 하네스 설치 시점(2026-07-31)의 기존 의존성 부채.
#
# 이 파일은 우회가 아니라 기록이다. 아래 등재된 건만 조용해지고, 새로 들어오는
# 취약 의존성은 pre-push 에서 그대로 막힌다. 기존 ruff 75건을 비차단으로 내리고
# 그 결정을 .agents/context/codebase-conventions.md 에 남긴 것과 같은 모양이다 —
# 부채를 측정해 고정하고, 새 부채는 계속 막는다.
#
# 실측: 13패키지 74건(별칭 포함, 고유 취약점 39건, Critical 2). 전부 실사용 경로
# 위에 있다 — pymysql(DB 드라이버), h11(uvicorn HTTP 파서), jinja2(SSR 템플릿),
# pyjwt(인증), python-multipart(폼 파싱), cryptography(JWT/bcrypt 하부).
#
# 왜 지금 올리지 않았나: 이 레포의 테스트 110개는 전부 순수 유닛이라 위 6개
# 패키지 중 실행하는 것이 0개다 (TestClient/httpx 사용 0, app/util/auth.py 테스트
# 0, Jinja2 렌더링 테스트 0). 지금 버전을 올리고 초록을 보면 그건 가짜 초록이다.
#
# 해소 순서:
#   1) HTTP·인증 통합 테스트를 추가해 오라클을 만든다
#   2) 의존성을 올린다 (74건 중 대부분은 상류 수정본이 있다)
#   3) 해소된 항목을 이 파일에서 지운다 — 목록이 비면 파일을 지운다
#
# 이 파일이 오래 살아 있으면 그 자체가 부채 신호다. 늘어나면 더 그렇다.

