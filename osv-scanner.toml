# osv-scanner 기준선 — moru 하네스 설치 시점(2026-07-31)의 기존 의존성 부채.
#
# 이 파일은 우회가 아니라 기록이다. 아래 등재된 건만 조용해지고, 새로 들어오는
# 취약 의존성은 pre-push 에서 그대로 막힌다. 기존 린트 부채를 비차단으로 내리고
# 그 결정을 .agents/context/codebase-conventions.md 에 남긴 것과 같은 모양이다 —
# 부채를 측정해 고정하고, 새 부채는 계속 막는다.
#
# **건수를 이 머리말에 적지 않는다.** 아래 등재 목록이 곧 건수이고, 해소할 때마다
# 항목을 지우는 것이 이 파일의 사용법이라(3번 참조) 머리말 숫자는 설계상 어긋난다.
# 현재 값은 `osv-scanner --recursive .`. 움직이는 값은 문서가 아니라 명령이
# 소유한다는 이 레포 규칙 그대로다 (codebase-conventions.md § 린트 부채).
#
# 성격만 적는다 — 이건 안 움직인다. 취약점이 몰린 곳이 전부 **실사용 경로 위**다:
# pymysql(DB 드라이버), h11(uvicorn HTTP 파서), jinja2(SSR 템플릿), pyjwt(인증),
# python-multipart(폼 파싱), cryptography(JWT/bcrypt 하부).
#
# 왜 지금 올리지 않았나: 이 레포의 앱 테스트는 전부 순수 유닛이라 위 6개 패키지 중
# **실행하는 것이 하나도 없다** (TestClient/httpx 사용 0, app/util/auth.py 테스트 0,
# Jinja2 렌더링 테스트 0). 오라클이 없으니 지금 버전을 올리고 초록을 보면 그건 가짜
# 초록이다. `tests/harness/` 골든 테스트도 여기선 도움이 안 된다 — 그건 강제
# 스크립트를 심판하지 앱 의존성을 타지 않는다.
#
# 해소 순서:
#   1) HTTP·인증 통합 테스트를 추가해 오라클을 만든다
#   2) 의존성을 올린다 (등재된 것 대부분은 상류 수정본이 있다)
#   3) 해소된 항목을 이 파일에서 지운다 — 목록이 비면 파일을 지운다
#
# 이 파일이 오래 살아 있으면 그 자체가 부채 신호다. 늘어나면 더 그렇다.

